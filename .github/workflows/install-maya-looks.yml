name: Install Maya Trail looks
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the looks update into place
        run: |
          unzip -o forge-maya-trail-looks-update.zip -d .
          rm forge-maya-trail-looks-update.zip
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Maya Trail Set: wire the finished ChatGPT combo portraits"
          git push
