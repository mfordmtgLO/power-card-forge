name: Install Back to default look
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the update into place
        run: |
          unzip -o forge-look-default-update.zip -d .
          rm forge-look-default-update.zip
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Maya: Back to default look button + game look note"
          git push
